worker_processes 1;
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 20M;

    # Lemmy: ActivityPub / non-GET requests go to the backend, browser pages to lemmy-ui
    map "$request_method:$http_accept" $lemmy_proxpass {
        default "http://lemmy-ui:1234";
        "~^(?:GET|HEAD):.*?application\/(?:activity|ld)\+json" "http://lemmy:8536";
        "~^(?!(GET|HEAD)).*:" "http://lemmy:8536";
    }

    server {
        listen 443 ssl;
        server_name lemmy.liftdroid.test;
        ssl_certificate     /certs/wildcard.crt;
        ssl_certificate_key /certs/wildcard.key;

        location / {
            set $upstream $lemmy_proxpass;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ~ ^/(api|pictrs|feeds|nodeinfo|version|\.well-known) {
            set $backend "http://lemmy:8536";
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
