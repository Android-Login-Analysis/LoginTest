# LIFTDroid revision: self-hosted backends for the held-out apps (Dataset B).
# All services sit behind one TLS proxy for *.liftdroid.test (certificate signed by our own test CA).
name: liftsvc

services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "10.99.0.124:443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/wildcard.crt:/certs/wildcard.crt:ro
      - ./certs/wildcard.key:/certs/wildcard.key:ro
    depends_on: [lemmy, lemmy-ui, paperless, jellyfin, mattermost, kitchenowl, freshrss, synapse, seafile]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lemmy
      POSTGRES_PASSWORD: ${LEMMY_DB_PASSWORD}
      POSTGRES_DB: lemmy
    volumes:
      - ./data/postgres:/var/lib/postgresql/data

  pictrs:
    image: asonix/pictrs:0.5.25
    restart: unless-stopped
    user: "991:991"
    environment:
      PICTRS__SERVER__API_KEY: ${PICTRS_API_KEY}
      PICTRS__MEDIA__ANIMATION__MAX_WIDTH: "256"
      PICTRS__MEDIA__ANIMATION__MAX_HEIGHT: "256"
    volumes:
      - ./data/pictrs:/mnt

  lemmy:
    image: dessalines/lemmy:0.19.21
    restart: unless-stopped
    environment:
      RUST_LOG: "warn"
      LEMMY_CONFIG_LOCATION: "/config/config.hjson"
    volumes:
      - ./lemmy.hjson:/config/config.hjson:ro
    depends_on: [postgres, pictrs]

  lemmy-ui:
    image: dessalines/lemmy-ui:0.19.21
    restart: unless-stopped
    environment:
      LEMMY_UI_LEMMY_INTERNAL_HOST: "lemmy:8536"
      LEMMY_UI_LEMMY_EXTERNAL_HOST: "lemmy.liftdroid.test"
      LEMMY_UI_HTTPS: "true"
    depends_on: [lemmy]

  paperless-redis:
    image: redis:7-alpine
    restart: unless-stopped

  paperless:
    image: paperlessngx/paperless-ngx:2.14.7
    restart: unless-stopped
    depends_on: [paperless-redis]
    environment:
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_URL: https://paperless.liftdroid.test
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_ADMIN_USER: lifttest
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_ADMIN_MAIL: lifttest@example.com
      PAPERLESS_TIME_ZONE: UTC
    volumes:
      - ./data/paperless/data:/usr/src/paperless/data
      - ./data/paperless/media:/usr/src/paperless/media

  # Findroid #928/#877 were reported against Jellyfin 10.10.0
  jellyfin:
    image: jellyfin/jellyfin:10.10.0
    restart: unless-stopped
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache

  # Mattermost (MFA issues #7524/#8291); its own database
  mattermost-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: ${MM_DB_PASSWORD}
      POSTGRES_DB: mattermost
    volumes:
      - ./data/mattermost-db:/var/lib/postgresql/data

  mattermost:
    image: mattermost/mattermost-team-edition:9.11.6
    restart: unless-stopped
    depends_on: [mattermost-db]
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:${MM_DB_PASSWORD}@mattermost-db:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: https://mattermost.liftdroid.test
      MM_SERVICESETTINGS_ENABLEMULTIFACTORAUTHENTICATION: "true"
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION: "false"
    volumes:
      - ./data/mattermost/config:/mattermost/config
      - ./data/mattermost/data:/mattermost/data
      - ./data/mattermost/logs:/mattermost/logs
      - ./data/mattermost/plugins:/mattermost/plugins
      - ./data/mattermost/client-plugins:/mattermost/client/plugins

  # KitchenOwl #626 was reported with server 106 (v0.6.8)
  kitchenowl:
    image: tombursch/kitchenowl:v0.6.8
    restart: unless-stopped
    environment:
      JWT_SECRET_KEY: ${KITCHENOWL_JWT_SECRET}
      FRONT_URL: https://kitchenowl.liftdroid.test
    volumes:
      - ./data/kitchenowl:/data

  # Read You (Fever / Google Reader API logins)
  freshrss:
    image: freshrss/freshrss:1.24.3
    restart: unless-stopped
    environment:
      TZ: UTC
      CRON_MIN: "*/30"
    volumes:
      - ./data/freshrss/data:/var/www/FreshRSS/data
      - ./data/freshrss/extensions:/var/www/FreshRSS/extensions

  # Matrix homeserver for FluffyChat
  synapse:
    image: matrixdotorg/synapse:v1.120.2
    restart: unless-stopped
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ./data/synapse:/data

  # Seafile CE for Seadroid (#1112 was on server 12)
  seafile-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SEAFILE_DB_ROOT_PASSWORD}
      MYSQL_LOG_CONSOLE: "true"
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - ./data/seafile-db:/var/lib/mysql

  seafile-memcached:
    image: memcached:1.6.29
    restart: unless-stopped
    entrypoint: memcached -m 256

  seafile:
    image: seafileltd/seafile-mc:12.0-latest
    restart: unless-stopped
    depends_on: [seafile-db, seafile-memcached]
    environment:
      DB_HOST: seafile-db
      DB_PORT: "3306"
      DB_USER: seafile
      DB_ROOT_PASSWD: ${SEAFILE_DB_ROOT_PASSWORD}
      DB_PASSWORD: ${SEAFILE_DB_PASSWORD}
      SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
      SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
      SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
      TIME_ZONE: UTC
      INIT_SEAFILE_ADMIN_EMAIL: lifttest@liftdroid.test
      INIT_SEAFILE_ADMIN_PASSWORD: ${SEAFILE_ADMIN_PASSWORD}
      SEAFILE_SERVER_HOSTNAME: seafile.liftdroid.test
      SEAFILE_SERVER_PROTOCOL: https
      SITE_ROOT: /
      NON_ROOT: "false"
      JWT_PRIVATE_KEY: ${SEAFILE_JWT_KEY}
      SEAFILE_LOG_TO_STDOUT: "true"
      ENABLE_SEADOC: "false"
      CACHE_PROVIDER: memcached
      MEMCACHED_HOST: seafile-memcached
      MEMCACHED_PORT: "11211"
    volumes:
      - ./data/seafile:/shared

  # ---- Dataset B2 (2026-11-18): backends for the second batch of held-out issues ----
  vikunja:                       # Vikunja app #102
    image: vikunja/vikunja:0.24.6
    restart: unless-stopped
    environment:
      VIKUNJA_SERVICE_PUBLICURL: https://vikunja.liftdroid.test/
      VIKUNJA_SERVICE_JWTSECRET: ${VIKUNJA_JWT}
      VIKUNJA_DATABASE_TYPE: sqlite
      VIKUNJA_DATABASE_PATH: /db/vikunja.db
      VIKUNJA_SERVICE_ENABLEREGISTRATION: "true"
    volumes:
      - ./data/vikunja/files:/app/vikunja/files
      - ./data/vikunja/db:/db

  gotify:                        # Gotify #161 (special-character password), #201 (redirecting URL)
    image: gotify/server:2.6.1
    restart: unless-stopped
    environment:
      GOTIFY_DEFAULTUSER_NAME: lifttest
      GOTIFY_DEFAULTUSER_PASS: ${LIFT_SVC_PASSWORD}
    volumes:
      - ./data/gotify:/app/data

  navidrome:                     # Subtracks #55
    image: deluan/navidrome:0.53.3
    restart: unless-stopped
    volumes:
      - ./data/navidrome:/data
      - ./data/music:/music:ro

  paperless2:                    # Paperless Mobile #548: paperless-ngx 2.20 with the update check enabled
    image: paperlessngx/paperless-ngx:2.20.0
    restart: unless-stopped
    depends_on: [paperless-redis]
    environment:
      PAPERLESS_REDIS: redis://paperless-redis:6379/1
      PAPERLESS_URL: https://paperless2.liftdroid.test
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_ADMIN_USER: lifttest
      PAPERLESS_ADMIN_PASSWORD: ${LIFT_SVC_PASSWORD}
      PAPERLESS_ADMIN_MAIL: lifttest@example.com
      PAPERLESS_ENABLE_UPDATE_CHECK: "true"
    volumes:
      - ./data/paperless2/data:/usr/src/paperless/data
      - ./data/paperless2/media:/usr/src/paperless/media

  lemmy2-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: {POSTGRES_USER: lemmy, POSTGRES_PASSWORD: "${LEMMY_DB_PASSWORD}", POSTGRES_DB: lemmy}
    volumes:
      - ./data/lemmy2-db:/var/lib/postgresql/data

  lemmy2:                        # Jerboa #1487: Lemmy 0.19.3 private instance
    image: dessalines/lemmy:0.19.3
    restart: unless-stopped
    environment: {RUST_LOG: warn, LEMMY_CONFIG_LOCATION: /config/config.hjson}
    volumes:
      - ./lemmy2.hjson:/config/config.hjson:ro
    depends_on: [lemmy2-db]

  lemmy3-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment: {POSTGRES_USER: lemmy, POSTGRES_PASSWORD: "${LEMMY_DB_PASSWORD}", POSTGRES_DB: lemmy}
    volumes:
      - ./data/lemmy3-db:/var/lib/postgresql/data

  lemmy3:                        # Jerboa #920: Lemmy 0.17.4
    image: dessalines/lemmy:0.17.4
    restart: unless-stopped
    environment: {RUST_LOG: warn, LEMMY_CONFIG_LOCATION: /config/config.hjson}
    volumes:
      - ./lemmy3.hjson:/config/config.hjson:ro
    depends_on: [lemmy3-db]

  nextcloud:                     # Nextcloud Talk #6329, Nextcloud Notes #562, Floccus #1230
    image: nextcloud:30-apache
    restart: unless-stopped
    environment:
      NEXTCLOUD_ADMIN_USER: lifttest
      NEXTCLOUD_ADMIN_PASSWORD: ${LIFT_SVC_PASSWORD}
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_TRUSTED_DOMAINS: nextcloud.liftdroid.test
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: nextcloud.liftdroid.test
    volumes:
      - ./data/nextcloud:/var/www/html

  memos:                         # MoeMemos #295: Memos 0.25.3
    image: neosmemo/memos:0.25.3
    restart: unless-stopped
    volumes:
      - ./data/memos:/var/opt/memos

  jellyfin2:                     # Findroid #679: Jellyfin 10.9.0
    image: jellyfin/jellyfin:10.9.0
    restart: unless-stopped
    volumes:
      - ./data/jellyfin2/config:/config
      - ./data/jellyfin2/cache:/cache

  gitea:                         # GitNex #1390, #1280, #1392: Gitea 1.20.1
    image: gitea/gitea:1.20.1
    restart: unless-stopped
    environment:
      GITEA__server__ROOT_URL: https://gitea.liftdroid.test/
      GITEA__server__DOMAIN: gitea.liftdroid.test
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__service__DISABLE_REGISTRATION: "false"
    volumes:
      - ./data/gitea:/data

  audiobookshelf:                # Audiobookshelf app #1900 (username with a trailing space)
    image: advplyr/audiobookshelf:2.17.5
    restart: unless-stopped
    volumes: [./data/abs/config:/config, ./data/abs/metadata:/metadata]

  audiobookshelf2:               # Audiobookshelf app #868 (2023 server)
    image: advplyr/audiobookshelf:2.4.4
    restart: unless-stopped
    volumes: [./data/abs2/config:/config, ./data/abs2/metadata:/metadata]

  gotosocial:                    # AndStatus #551 (rotation in the login WebView)
    image: superseriousbusiness/gotosocial:0.17.3
    restart: unless-stopped
    user: "1000:1000"
    environment:
      GTS_HOST: gotosocial.liftdroid.test
      GTS_PROTOCOL: https
      GTS_DB_TYPE: sqlite
      GTS_DB_ADDRESS: /gotosocial/storage/sqlite.db
      GTS_TRUSTED_PROXIES: 172.16.0.0/12
      GTS_LETSENCRYPT_ENABLED: "false"
    volumes: [./data/gotosocial:/gotosocial/storage]

  paperless3:                    # Paperless Mobile #409: paperless-ngx 2.7.2, non-superuser without view permissions
    image: paperlessngx/paperless-ngx:2.7.2
    restart: unless-stopped
    depends_on: [paperless-redis]
    environment:
      PAPERLESS_REDIS: redis://paperless-redis:6379/2
      PAPERLESS_URL: https://paperless3.liftdroid.test
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_ADMIN_USER: lifttest
      PAPERLESS_ADMIN_PASSWORD: ${LIFT_SVC_PASSWORD}
      PAPERLESS_ADMIN_MAIL: lifttest@example.com
    volumes: [./data/paperless3/data:/usr/src/paperless/data, ./data/paperless3/media:/usr/src/paperless/media]

  mattermost2-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: {POSTGRES_USER: mmuser, POSTGRES_PASSWORD: "${MM_DB_PASSWORD}", POSTGRES_DB: mattermost}
    volumes: [./data/mattermost2-db:/var/lib/postgresql/data]

  mattermost2:                   # Mattermost #9635: server 11.5.1
    image: mattermost/mattermost-team-edition:11.5.1
    restart: unless-stopped
    depends_on: [mattermost2-db]
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:${MM_DB_PASSWORD}@mattermost2-db:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: https://mattermost2.liftdroid.test
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_EMAILSETTINGS_REQUIREEMAILVERIFICATION: "false"
    volumes:
      - ./data/mattermost2/config:/mattermost/config
      - ./data/mattermost2/data:/mattermost/data
      - ./data/mattermost2/logs:/mattermost/logs
      - ./data/mattermost2/plugins:/mattermost/plugins
      - ./data/mattermost2/client-plugins:/mattermost/client/plugins

  qbittorrent:                   # qBitController #263: qBittorrent 5.2.0 WebUI
    image: lscr.io/linuxserver/qbittorrent:5.2.0
    restart: unless-stopped
    environment: {PUID: "1000", PGID: "1000", TZ: UTC, WEBUI_PORT: "8080"}
    volumes: [./data/qbittorrent:/config]

  mealie:                        # Mealient #189: Mealie 1.0.0-RC1.1
    image: ghcr.io/mealie-recipes/mealie:v1.0.0-RC1.1
    restart: unless-stopped
    environment: {BASE_URL: "https://mealie.liftdroid.test", ALLOW_SIGNUP: "true", TZ: UTC}
    volumes: [./data/mealie:/app/data]

  vaultwarden:                   # Bitwarden #3410, #3796, #6376, #6576
    image: vaultwarden/server:1.32.7
    restart: unless-stopped
    environment: {DOMAIN: "https://vaultwarden.liftdroid.test", SIGNUPS_ALLOWED: "true", SIGNUPS_VERIFY: "false"}
    volumes: [./data/vaultwarden:/data]
