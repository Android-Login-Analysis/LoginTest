# Application configuration
app.path=/app/apps/sample-app.apk
app.package=com.example.sampleapp
app.activity=com.example.sampleapp.MainActivity

# Test configuration
test.rounds=3
test.timeout=60000
test.credentials.file=credentials.json

# Appium configuration
appium.url=http://localhost:4723/wd/hub
device.name=test_device
platform.name=Android
platform.version=12
automation.name=UiAutomator2

# Emulator configuration
emulator.name=test_device
emulator.port=5554
emulator.timeout=300

# Frida configuration
frida.enabled=true
frida.script.path=frida-scripts/login_agent.js

# Logging configuration
log.level=INFO
report.output.dir=/app/reports
screenshot.enabled=true
screenshot.dir=/app/test-artifacts/screenshots 