# =============================================================================
# AndroidLoginDetector main configuration file
# =============================================================================

# =============================================================================
# Application configuration
# =============================================================================
#app.path=apps/org.mian.gitnex_550.apk
#app.path=apps/Kickstarter_3.24.1_apkcombo.com.apk
#app.path=apps/com.pitchedapps.frost_3020000.apk
#app.path=apps/com.github.libretube_62.apk
app.path=apps/chat.simplex.app_310.apk
#app.package=org.mian.gitnex
#app.package=com.kickstarter.kickstarter
#app.package=com.pitchedapps.frost
#app.package=com.github.libretube
app.package=chat.simplex.app

#app.activity=org.mian.gitnex.activities.MainActivity
#app.activity=com.kickstarter.ui.activities.DiscoveryActivity
#app.activity=com.pitchedapps.frost.StartActivity
#app.activity=com.github.libretube.activities.MainActivity
app.activity=chat.simplex.app.MainActivity

# =============================================================================
# Test configuration
# =============================================================================
# Test rounds number
test.rounds=1
# Test timeout per round (milliseconds)
test.timeout=360000
# Test duration per round (milliseconds)
test.duration=300000
# Round interval (seconds)
test.round.interval=3
# Credential input interval (milliseconds)
test.input.interval=800
# Login wait time (seconds)
test.login.wait=10
# Snapshot recovery wait time (seconds)
test.snapshot.wait=45

# Credential file path
test.credentials.file=credentials.json

# =============================================================================
# Emulator configuration
# =============================================================================
emulator.name=test_device
emulator.port=5554
emulator.timeout=300
#emulator.snapshot=snap_gitnex_login
#emulator.snapshot=snap_kickstarter_login
#emulator.snapshot=snap_libretube_login
emulator.snapshot=snap_newsblur_login
# Emulator startup parameters
emulator.args=-no-audio -no-window -gpu swiftshader_indirect -camera-back none -camera-front none

# =============================================================================
# Frida configuration
# =============================================================================
frida.enabled=true
frida.script.path=src/main/resources/login_agent.js
frida.controller.path=scripts/frida_controller.py
frida.patterns.path=src/main/resources/regex_patterns.txt
frida.server.path=resources/frida-server
# Frida timeout (seconds)
frida.timeout=120
frida.retry.count=5
frida.retry.delay=3
# Frida log level
frida.log.level=INFO
frida.log.file=logs/frida.log

# =============================================================================
# Monkey configuration - event generation parameters
# =============================================================================
monkey.events=1000
monkey.throttle=500
monkey.touch.percentage=100
monkey.motion.percentage=0
monkey.trackball.percentage=0
monkey.syskeys.percentage=0
monkey.nav.percentage=0
monkey.majornav.percentage=0
monkey.appswitch.percentage=0
monkey.anyevent.percentage=0

# =============================================================================
# Log and report configuration
# =============================================================================
log.level=INFO
report.output.dir=reports
screenshot.enabled=true
screenshot.dir=test-artifacts/screenshots
# Log file retention days
log.retention.days=7

# =============================================================================
# Static analysis configuration (KISS)
# =============================================================================
# Static analysis output directory
static.analysis.output.dir=reports/static_analysis
# Static analysis output file name pattern (use {apk_name} and {version} as placeholders)
# Examples: 
#   {apk_name}.json -> com.logseq.app_87.json
#   {apk_name}_v{version}.json -> com.logseq.app_87_v1.json
#   app{version}.json -> app1.json
#   analysis_{apk_name}_v{version}.json -> analysis_com.logseq.app_87_v1.json
static.analysis.output.pattern={apk_name}_{version}.json
# Static analysis version number (for testing different analysis methods)
static.analysis.version=1
# Regex patterns file path for static analysis
static.analysis.patterns.path=src/main/resources/regex_patterns.txt

# Optional: extra IR/Jimple textual keywords to aid static matching (comma-separated)
# Scope: ONLY for IR body text heuristic scan (NOT for provider/SDK names)
# Keep empty by default. Add minimal, generic tokens if needed, e.g.:
# static.ir.keywords=/login,/auth,authorization:,bearer ,grant_type,code_verifier,code_challenge
static.ir.keywords=

# =============================================================================
# Detection configuration
# =============================================================================
# Login page detection timeout (seconds)
detection.login.timeout=120
# API log analysis interval (seconds)
detection.api.interval=2
# Crash detection interval (seconds)
detection.crash.interval=3

# =============================================================================
# State machine configuration
# =============================================================================
# State machine validation enabled
statemachine.validation.enabled=true
# State transition error report threshold
statemachine.error.threshold=1

# =============================================================================
# Screenshot configuration
# =============================================================================
# Take one screenshot every N Monkey events (used by AndroidLoginDetector.startMonkeyScreenshotWatcher)
monkey.screenshot.interval=10

# =============================================================================
# UI element recognition configuration
# =============================================================================
# Login button recognition pattern
ui.login.button.patterns=login,log in,log_in,sign in,sign_in,signin,submit,enter,go,continue,proceed,next,authenticate,done,confirm,access
# Username field recognition pattern
ui.username.field.patterns=username,user,email,emailaddress,email_address,login,account,user_id,login_id,email_id,user_name,login_name,userId,accountId,phone,phone_number,mobile
# Password field recognition pattern
ui.password.field.patterns=password,passwd,pass,pwd,secret,password1,pwd_field,security,password_field,passcode,pin
# Google login recognition pattern (keep explicit phrases only to avoid false positives)
ui.google.login.patterns=sign in with google,continue with google,google sign in,google_sign_in,google_login
# Facebook login recognition pattern (keep explicit phrases only to avoid false positives)
ui.facebook.login.patterns=sign in with facebook,continue with facebook,facebook login,facebook_login,fb_login
# Apple login recognition pattern (optional)
ui.apple.login.patterns=apple,sign in with apple,apple id,appleid,apple_login
# Login activity recognition pattern - common Activity/Fragment names for login screens
ui.login.activity.patterns=LoginActivity,SignInActivity,AuthActivity,AuthenticationActivity,LoginFragment,SignInFragment,LoginScreen,SignInScreen,AuthFragment,AccountLoginActivity,WelcomeActivity,OnboardingActivity,SplashActivity,MainActivity,LaunchActivity,StartActivity,InitActivity,EntryActivity,AccessActivity,CredentialActivity,UserLoginActivity,AccountActivity,ProfileActivity
# Login page recognition pattern
ui.login.page.patterns=login,log in,log_in,signin,sign in,sign_in,signon,sign_on,auth,authentication,credentials,login_screen,signin_screen,account,account_login

# =============================================================================
# Post-login handling (simple toggles)
# =============================================================================
# Seconds to wait after clicking login before restoring baseline snapshot
post.login.wait.seconds=10
# Whether to restore baseline snapshot when Monkey events are exhausted without a click
monkey.restore.on.exhausted=true

# =============================================================================
# Network Chaos Testing Configuration
# =============================================================================
# Enable network chaos testing during login
# Set to true to enable network disruptions during testing (helps find ANR and timeout bugs)
network.chaos.enabled=true
# Network state ratio: good:bad (e.g., 40:60 means 40% good network, 60% bad network)
network.good.ratio=40
network.bad.ratio=60
# Network state switch interval in seconds
network.switch.interval=60
# Network chaos mode: random, periodic, adaptive
# - random: randomly switch between good/bad based on ratio
# - periodic: switch every N seconds
# - adaptive: switch based on login progress (more chaos when stuck)
network.chaos.mode=random
# Network disruption methods (comma-separated): disable_data, disable_wifi, slow_network, packet_loss, high_latency
network.disruption.methods=disable_data,slow_network
# Minimum network disruption duration in seconds (when in bad state)
network.disruption.min.duration=10
# Maximum network disruption duration in seconds (when in bad state)
network.disruption.max.duration=30