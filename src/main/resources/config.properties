# =============================================================================
# AndroidLoginDetector main configuration file
# =============================================================================

# =============================================================================
# Application configuration
# =============================================================================
app.path=apps/org.mian.gitnex_550.apk
app.package=org.mian.gitnex
app.activity=org.mian.gitnex.activities.MainActivity

# =============================================================================
# Test configuration
# =============================================================================
# Test rounds number
test.rounds=5
# Test timeout per round (milliseconds)
test.timeout=360000
# Test duration per round (milliseconds)
test.duration=300000
# Round interval (seconds)
test.round.interval=3
# Credential input interval (milliseconds)
test.input.interval=800
# Login wait time (seconds)
test.login.wait=8
# Snapshot recovery wait time (seconds)
test.snapshot.wait=45

# Credential file path
test.credentials.file=credentials.json

# =============================================================================
# Emulator configuration
# =============================================================================
emulator.name=test_device
emulator.port=5554
emulator.timeout=300
emulator.snapshot=snap_gitnex_login
# Emulator startup parameters
emulator.args=-no-audio -no-window -gpu swiftshader_indirect -camera-back none -camera-front none

# =============================================================================
# Frida configuration
# =============================================================================
frida.enabled=true
frida.script.path=src/main/resources/login_agent.js
frida.controller.path=scripts/frida_controller.py
frida.patterns.path=src/main/resources/regex_patterns.txt
frida.server.path=resources/frida-server
# Frida timeout (seconds)
frida.timeout=120
frida.retry.count=5
frida.retry.delay=3
# Frida log level
frida.log.level=INFO
frida.log.file=logs/frida.log

# =============================================================================
# Monkey configuration - event generation parameters
# =============================================================================
monkey.events=100
monkey.throttle=200
monkey.touch.percentage=100
monkey.motion.percentage=0
monkey.trackball.percentage=0
monkey.syskeys.percentage=0
monkey.nav.percentage=0
monkey.majornav.percentage=0
monkey.appswitch.percentage=0
monkey.anyevent.percentage=0

# =============================================================================
# Log and report configuration
# =============================================================================
log.level=INFO
report.output.dir=reports
screenshot.enabled=true
screenshot.dir=test-artifacts/screenshots
# Log file retention days
log.retention.days=7

# =============================================================================
# Detection configuration
# =============================================================================
# Login page detection timeout (seconds)
detection.login.timeout=15
# API log analysis interval (seconds)
detection.api.interval=2
# Crash detection interval (seconds)
detection.crash.interval=3

# =============================================================================
# State machine configuration
# =============================================================================
# State machine validation enabled
statemachine.validation.enabled=true
# State transition error report threshold
statemachine.error.threshold=1

# =============================================================================
# UI element recognition configuration
# =============================================================================
# Login button recognition pattern
ui.login.button.patterns=login,sign_in,signin,submit,enter,go,continue,authenticate,log_in
# Username field recognition pattern
ui.username.field.patterns=username,user,email,login,account,user_id,login_id,email_id,user_name,login_name
# Password field recognition pattern
ui.password.field.patterns=password,passwd,pass,pwd,secret,password1,pwd_field,security,password_field
# Google login recognition pattern
ui.google.login.patterns=google,gmail,sign in with google,google sign in,google_sign_in,google_login
# Facebook login recognition pattern
ui.facebook.login.patterns=facebook,fb,sign in with facebook,facebook login,facebook_login,fb_login
# Login activity recognition pattern
ui.login.activity.patterns=LoginActivity,SignInActivity,AuthActivity,AuthenticationActivity,LoginFragment,SignInFragment
# Login page recognition pattern
ui.login.page.patterns=login,signin,auth,authentication,credentials,login_screen,signin_screen 