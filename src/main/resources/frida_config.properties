# Frida Configuration

# Timeout settings (in seconds)
frida.timeout=30
frida.retry.count=3
frida.retry.delay=2

# Logging settings
frida.log.level=INFO
frida.log.file=logs/frida.log

# Monitoring settings
frida.monitor.login=true
frida.monitor.auth=true
frida.monitor.sign=true
frida.monitor.verify=true
frida.monitor.validate=true

# Activity patterns to monitor
frida.activity.patterns=LoginActivity,SignInActivity,AuthActivity,AuthenticationActivity

# Method patterns to monitor
frida.method.patterns=login,auth,sign,authenticate,verify,validate 